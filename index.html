<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dfe9e9">
  <title>潮汕三市｜吃玩行地图</title>
  <link rel="stylesheet" href="assets/leaflet.css">
  <style>
    :root {
      --ink: #17222b;
      --muted: #687681;
      --paper: #fbfaf6;
      --line: rgba(23, 34, 43, .12);
      --shantou: #147d92;
      --chaozhou: #c4614c;
      --jieyang: #a27b18;
      --rail: #263a65;
      --route: #8f4d8c;
      --hotel: #2f6fbb;
      --play: #398761;
      --food: #e87824;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      color: var(--ink);
      background: #dfe9e9;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #dfe9e9;
    }

    .topbar {
      position: absolute;
      z-index: 900;
      top: 18px;
      left: 18px;
      width: min(430px, calc(100vw - 36px));
      padding: 18px 20px 16px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 18px;
      background: rgba(251, 250, 246, .93);
      box-shadow: 0 16px 44px rgba(33, 57, 66, .18);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin-bottom: 5px;
      color: var(--route);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .filter {
      appearance: none;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .74);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: .18s ease;
    }

    .filter:hover { transform: translateY(-1px); }

    .filter.active {
      color: white;
      border-color: var(--ink);
      background: var(--ink);
    }

    .panel {
      position: absolute;
      z-index: 890;
      top: 205px;
      left: 18px;
      bottom: 22px;
      width: min(330px, calc(100vw - 36px));
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 16px;
      background: rgba(251, 250, 246, .91);
      box-shadow: 0 14px 36px rgba(33, 57, 66, .16);
      backdrop-filter: blur(14px);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 5px 9px;
    }

    .panel-heading strong { font-size: 14px; }
    .panel-heading span { color: var(--muted); font-size: 11px; }

    .panel-title {
      display: grid;
      gap: 2px;
    }

    .panel-toggle {
      display: none;
      min-width: 58px;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .82);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .place-list {
      display: grid;
      gap: 6px;
    }

    .place-button {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--ink);
      background: rgba(255, 255, 255, .64);
      text-align: left;
      cursor: pointer;
    }

    .place-button:hover {
      border-color: var(--line);
      background: white;
    }

    .place-button b {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
    }

    .place-button small {
      color: var(--muted);
      font-size: 11px;
    }

    .city-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
    }

    .map-marker-shell { background: transparent; border: 0; }

    .pin {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 2px solid white;
      border-radius: 50% 50% 50% 8px;
      color: white;
      box-shadow: 0 4px 12px rgba(24, 35, 43, .28);
      font-size: 12px;
      font-weight: 800;
      transform: rotate(-45deg);
    }

    .pin > span { transform: rotate(45deg); }
    .pin.food { background: var(--food); }
    .pin.play { background: var(--play); }
    .pin.station { width: 30px; height: 30px; background: var(--rail); }
    .pin.station.secondary { opacity: .72; transform: rotate(-45deg) scale(.86); }
    .pin.airport { background: var(--route); }
    .pin.hotel { background: var(--hotel); }

    .city-label {
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 8px;
      color: white;
      box-shadow: 0 3px 12px rgba(31, 48, 54, .2);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .1em;
      text-shadow: 0 1px 2px rgba(0,0,0,.2);
      white-space: nowrap;
    }

    .city-label.shantou { background: rgba(20, 125, 146, .88); }
    .city-label.chaozhou { background: rgba(196, 97, 76, .88); }
    .city-label.jieyang { background: rgba(162, 123, 24, .88); }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: 0 12px 34px rgba(28, 44, 52, .22);
    }

    .leaflet-popup-content {
      min-width: 210px;
      margin: 15px 16px;
      line-height: 1.5;
    }

    .popup-kicker {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .popup-title {
      margin: 2px 0 7px;
      font-size: 17px;
      font-weight: 780;
    }

    .popup-image-link {
      display: block;
      margin: 8px 0;
      color: var(--muted);
      text-decoration: none;
    }

    .popup-image {
      display: block;
      width: 100%;
      height: 155px;
      border-radius: 9px;
      object-fit: cover;
      background: #edf0ed;
    }

    .popup-source {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      text-align: right;
    }

    .popup-body { color: #3f4c54; font-size: 12px; }
    .popup-note { margin-top: 7px; color: #7a4d39; font-size: 11px; }

    .legend {
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 12px;
      background: rgba(251,250,246,.93);
      box-shadow: 0 8px 24px rgba(33,57,66,.14);
      color: #46545d;
      font-size: 11px;
      line-height: 1.8;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
    }

    .leaflet-control-layers {
      border: 0 !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 24px rgba(33,57,66,.14) !important;
    }

    @media (max-width: 700px) {
      .topbar {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        width: calc(100vw - max(20px, env(safe-area-inset-left) + env(safe-area-inset-right)));
        padding: 12px 14px;
      }
      h1 { font-size: clamp(21px, 7vw, 28px); }
      .subtitle { display: none; }
      .filters { gap: 6px; margin-top: 10px; }
      .filter { min-height: 38px; padding: 7px 12px; touch-action: manipulation; }
      .panel {
        top: auto;
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        width: auto;
        height: min(27dvh, 190px);
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        transition: height .2s ease;
      }
      .panel-toggle { display: block; }
      body.panel-collapsed .panel {
        height: 54px;
        overflow: hidden;
        padding-bottom: 8px;
      }
      body.panel-collapsed .panel-heading { padding-bottom: 3px; }
      .place-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .place-button { min-height: 58px; touch-action: manipulation; }
      .leaflet-control-layers { margin-top: 145px !important; }
      .legend { display: none; }
      .leaflet-popup-content { min-width: min(210px, calc(100vw - 86px)); }
      .leaflet-control-zoom a { width: 34px; height: 34px; line-height: 34px; }
    }

    @media (max-width: 390px), (max-height: 640px) {
      .eyebrow { display: none; }
      .topbar { padding: 10px 12px; }
      .filters { margin-top: 7px; }
      .filter { min-height: 34px; padding: 5px 9px; }
      .leaflet-control-layers { margin-top: 112px !important; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="潮汕三市地图"></div>

  <header class="topbar">

        detail: "龙湖区长江路 187 号福田里 4 栋；距汕头站约 1.2—1.5 公里。",
        note: "靠近汕头站；10 月 5 日乘动车前往揭阳时，仍应预留国庆堵车和进站安检时间。",
        href: "https://m.ctrip.com/html5/hotel/hoteldetail/96552781.html"
      },
      {
        name: "揭阳宾馆（揭阳古城店）",
        city: "jieyang",
        lat: 23.538321,
        lng: 116.355859,
        short: "10 月 5—7 日 · 2 晚",
        detail: "榕城区进贤门大道 17 号；豪华大床房，1 间。靠近揭阳古城、揭阳学宫和进贤门。",
        note: "10 月 7 日从这里前往潮汕机场，国庆期间应预留堵车和安检缓冲。",
        href: "https://m.ctrip.com/html5/hotel/hoteldetail/133532385.html"
      }
    ];

    const playPlaces = [
      {
        name: "凤凰镇", city: "chaozhou", lat: 23.903503, lng: 116.702906,
        short: "凤凰单丛茶乡",
        detail: "凤凰山南麓的单丛茶产地。适合在镇区喝茶，并顺带吃凤凰浮豆干、畲鹅粉和糟肉。",
        note: "此点为凤凰镇镇区；凤凰天池、乌岽茶区还需继续进山。从潮州古城出发通常应按半天行程安排。"
      },
      ...window.FILMING_LOCATIONS
    ];

    const map = L.map("map", {
      zoomControl: false,
      minZoom: 8,
      maxZoom: 15
    }).setView([23.43, 116.45], 9);

    L.control.zoom({ position: "topright" }).addTo(map);

    const localPreview = location.protocol === "file:" ||
      location.hostname === "localhost" || location.hostname === "127.0.0.1";
    const forceBundledBasemap = new URLSearchParams(location.search).has("localTiles");
    const basemapUrl = localPreview && !forceBundledBasemap
      ? "https://llk15.github.io/october/assets/%E6%BD%AE%E6%B1%95%E5%BA%95%E5%9B%BE.pmtiles"
      : "assets/潮汕底图.pmtiles";

    const basemap = protomapsL.leafletLayer({
      url: basemapUrl,
      flavor: "light",
      lang: "zh-Hans",
      minZoom: 8,
      maxZoom: 15,
      bounds: [[22.886182, 115.606563], [24.232804, 117.318610]],
      attribution: '<a href="https://protomaps.com">Protomaps</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    map.createPane("boundaries");
    map.getPane("boundaries").style.zIndex = 310;
    map.getPane("boundaries").style.pointerEvents = "none";

    const boundaryLayer = L.geoJSON(window.CHAOSHAN_BOUNDARIES, {
      pane: "boundaries",
      style(feature) {
        const meta = cityMeta[String(feature.properties.adcode)];
        return {
          color: colors[meta.key],
          weight: 2.2,
          opacity: .9,
          fillColor: colors[meta.key],
          fillOpacity: .105
        };
      }
    }).addTo(map);

    const labelLayer = L.layerGroup().addTo(map);
    Object.values(cityMeta).forEach(city => {
      L.marker(city.center, {
        interactive: false,
        icon: L.divIcon({
          className: "map-marker-shell",
          html: '<div class="city-label ' + city.key + '">' + city.name + "</div>",
          iconSize: [82, 26],
          iconAnchor: [41, 13]
        })
      }).addTo(labelLayer);
    });

    function pinIcon(type, city, text, secondary) {
      return L.divIcon({
        className: "map-marker-shell",
        html: '<div class="pin ' + type + " " + city + (secondary ? " secondary" : "") + '"><span>' + text + "</span></div>",
        iconSize: [30, 30],
        iconAnchor: [9, 27],
        popupAnchor: [6, -25]
      });
    }

    function popupHtml(kicker, title, body, note, media) {
      const mediaHtml = media
        ? '<a class="popup-image-link" href="' + media.href + '" target="_blank" rel="noopener noreferrer">' +
          '<img class="popup-image" src="' + media.src + '" alt="' + media.alt + '" loading="lazy">' +
          '<span class="popup-source">配图来源：' + media.label + '</span></a>'
        : "";
      return '<div class="popup-kicker">' + kicker + '</div>' +
        '<div class="popup-title">' + title + '</div>' +
        mediaHtml +
        '<div class="popup-body">' + body + '</div>' +
        (note ? '<div class="popup-note">' + note + "</div>" : "");
    }

    const primaryStations = L.layerGroup().addTo(map);
    const secondaryStations = L.layerGroup().addTo(map);
    stations.forEach(station => {
      const marker = L.marker([station.lat, station.lng], {
        icon: pinIcon("station", station.city, "站", !station.primary)
      }).bindPopup(popupHtml(
        station.primary ? "主行程动车站" : "补充动车站",
        station.name,
        station.note,
        station.primary ? "国庆车次与停靠以12306为准。" : "当前行程通常无需使用。"
      ));
      marker.addTo(station.primary ? primaryStations : secondaryStations);
    });

    const foodLayer = L.layerGroup().addTo(map);
    const childFoodLayer = L.layerGroup().addTo(map);
    const foodMarkers = [];

    function confirmedPoints(place) {
      return place.pointIds
        .filter(id => window.FOOD_POINTS[id])
        .map(id => ({ id, ...window.FOOD_POINTS[id] }));
    }

    // 餐饮坐标来自高德或携程页面中的高德坐标（GCJ-02）；
    // Leaflet 底图是 OpenStreetMap（WGS-84），显示前需转换以避免数百米偏移。
    function gcj02ToWgs84(lat, lng) {
      const a = 6378245.0;
      const ee = 0.006693421622965943;
      const pi = Math.PI;
      const transformLat = (x, y) => {
        let value = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        value += (20 * Math.sin(6 * x * pi) + 20 * Math.sin(2 * x * pi)) * 2 / 3;
        value += (20 * Math.sin(y * pi) + 40 * Math.sin(y / 3 * pi)) * 2 / 3;
        value += (160 * Math.sin(y / 12 * pi) + 320 * Math.sin(y * pi / 30)) * 2 / 3;
        return value;
      };
      const transformLng = (x, y) => {
        let value = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        value += (20 * Math.sin(6 * x * pi) + 20 * Math.sin(2 * x * pi)) * 2 / 3;
        value += (20 * Math.sin(x * pi) + 40 * Math.sin(x / 3 * pi)) * 2 / 3;
        value += (150 * Math.sin(x / 12 * pi) + 300 * Math.sin(x / 30 * pi)) * 2 / 3;
        return value;
      };
      let dLat = transformLat(lng - 105, lat - 35);
      let dLng = transformLng(lng - 105, lat - 35);
      const radLat = lat / 180 * pi;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = dLat * 180 / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
      dLng = dLng * 180 / (a / sqrtMagic * Math.cos(radLat) * pi);
      return { lat: lat * 2 - (lat + dLat), lng: lng * 2 - (lng + dLng) };
    }

    function showChildPoints(place) {
      childFoodLayer.clearLayers();
      const points = confirmedPoints(place);
      if (!points.length) return;

      const grouped = new Map();
      points.forEach(point => {
        const displayPoint = gcj02ToWgs84(point.lat, point.lng);
        const key = displayPoint.lat.toFixed(6) + "," + displayPoint.lng.toFixed(6);
        if (!grouped.has(key)) grouped.set(key, { ...point, ...displayPoint, ids: [] });
        grouped.get(key).ids.push(point.id);
      });

      grouped.forEach(point => {
        const idText = point.ids.join(" / ");
        const videoHtml = point.ids
          .filter(id => window.FOOD_VIDEOS && window.FOOD_VIDEOS[id])
          .map(id => {
            const video = window.FOOD_VIDEOS[id];
            return '<br><b>视频时间：</b><a href="' + video.url + '" target="_blank" rel="noopener noreferrer">' + id + ' · ' + video.time + '</a>';
          })
          .join("");
        L.circleMarker([point.lat, point.lng], {
          radius: 5,
          color: "#ffffff",
          weight: 1.5,
          fillColor: "#e87824",
          fillOpacity: 0.96,
          bubblingMouseEvents: false
        })
          .bindTooltip("<b>" + idText + "</b> · " + point.name, { sticky: true })
          .bindPopup(popupHtml(
            "已核准的附属编号点",
            idText + " · " + point.name,
            point.address + '<br><a href="' + point.mapUrl + '" target="_blank" rel="noopener">在高德地图中查看</a>' +
              (point.sourceUrl ? ' · <a href="' + point.sourceUrl + '" target="_blank" rel="noopener">核验来源：' + point.sourceLabel + '</a>' : ' · 核验来源：高德地图') +
              videoHtml,
            "归属主点：" + place.name + "。坐标来源及核验记录见《吃/ref/美食地点编号.md》。"
          ))
          .addTo(childFoodLayer);
      });
    }

    foodPlaces.forEach(place => {
      const confirmedCount = confirmedPoints(place).length;
      const markerType = place.city === "chaozhou" ? "play" : "food";
      const marker = L.marker([place.lat, place.lng], {
        icon: pinIcon(markerType, place.city, place.city === "chaozhou" ? "玩" : "吃", false)
      }).bindPopup(popupHtml(
        cityMeta[place.city === "shantou" ? "440500" : place.city === "chaozhou" ? "445100" : "445200"].name + " · " + place.short,
        place.name,
        place.detail + (place.pointCount
          ? "<br><b>包含 " + place.pointCount + " 个编号点：</b>" + place.ids +
            "<br><b>已核准并显示：</b>" + confirmedCount + " 个编号；其余未确认具体 POI 的编号不显示附属点。"
          : "<br><b>补充片区：</b>未纳入四份攻略编号"),
        place.note
      ));
      marker.on("click", () => showChildPoints(place));
      marker.addTo(foodLayer);
      foodMarkers.push({ place, marker });
    });

    const airportLayer = L.layerGroup().addTo(map);
    L.marker([airport.lat, airport.lng], {
      icon: pinIcon("airport", "airport", "✈", false)
    }).bindPopup(popupHtml("航空交通", airport.name, airport.note, "赶飞机不要依赖临时跨城网约车。")).addTo(airportLayer);

    const hotelLayer = L.layerGroup().addTo(map);
    const hotelMarkers = [];
    hotels.forEach(hotel => {
      const marker = L.marker([hotel.lat, hotel.lng], {
        icon: pinIcon("hotel", hotel.city, "住", false)
      }).bindPopup(popupHtml(
        "已预订住宿 · " + hotel.short,
        hotel.name,
        hotel.detail + '<br><a href="' + hotel.href + '" target="_blank" rel="noopener noreferrer">查看酒店页面</a>',
        hotel.note
      ));
      marker.addTo(hotelLayer);
      hotelMarkers.push({ place: hotel, marker });
    });

    const playLayer = L.layerGroup().addTo(map);
    const playMarkers = [];
    playPlaces.forEach(place => {
      const marker = L.marker([place.lat, place.lng], {
        icon: pinIcon("play", place.city, "玩", false)
      }).bindPopup(popupHtml(
        place.name === "凤凰镇" ? "游玩点 · 茶乡体验" : "玩 · 《给阿嬷的情书》取景地",
        place.name,
        place.detail,
        place.note,
        place.image ? {
          src: place.image,
          alt: place.name + "实景配图",
          href: window.FILMING_SOURCE.url,
          label: window.FILMING_SOURCE.name
        } : null
      ));
      marker.addTo(playLayer);
      playMarkers.push({ place, marker });
    });

    const shantouStation = stations.find(station => station.name === "汕头站");
    const jieyangStation = stations.find(station => station.name === "揭阳站");
    const roadStyle = {
      color: "#8f4d8c",
      weight: 3,
      opacity: .76,
      dashArray: "7 10"
    };
    const railStyle = {
      color: "#263a65",
      weight: 4,
      opacity: .9,
      dashArray: "12 7"
    };

    const arrivalRoad = L.polyline([
      [airport.lat, airport.lng],
      [hotels[0].lat, hotels[0].lng]
    ], roadStyle).bindPopup(popupHtml(
      "10 月 1 日 · 打车",
      "潮汕机场 → 汕头住宿",
      "落地后打车前往全季酒店（汕头高铁站店）。",
      "酒店位于龙湖区长江路 187 号福田里 4 栋。"
    ));

    const shantouStationRoad = L.polyline([
      [hotels[0].lat, hotels[0].lng],
      [shantouStation.lat, shantouStation.lng]
    ], roadStyle).bindPopup(popupHtml(
      "10 月 5 日 · 市内接驳",
      "汕头住宿 → 汕头站",
      "退房后打车前往汕头站，乘动车去揭阳站。",
      "按实际车次倒推离店时间，并预留国庆堵车和进站安检时间。"
    ));

    const trainRoute = L.polyline([
      [shantouStation.lat, shantouStation.lng],
      [jieyangStation.lat, jieyangStation.lng]
    ], railStyle).bindPopup(popupHtml(
      "10 月 5 日 · 动车",
      "汕头站 → 揭阳站",
      "两站之间乘动车，不按地图直线自驾。",
      "车次与发到时间以 12306 最终出票信息为准。"
    ));

    const jieyangStationRoad = L.polyline([
      [jieyangStation.lat, jieyangStation.lng],
      [hotels[1].lat, hotels[1].lng]
    ], roadStyle).bindPopup(popupHtml(
      "10 月 5 日 · 市内接驳",
      "揭阳站 → 揭阳住宿",
      "到站后打车前往揭阳宾馆（揭阳古城店）。",
      "酒店位于进贤门大道 17 号。"
    ));

    const returnRoad = L.polyline([
      [hotels[1].lat, hotels[1].lng],
      [airport.lat, airport.lng]
    ], roadStyle).bindPopup(popupHtml(
      "10 月 7 日 · 返程",
      "揭阳住宿 → 潮汕机场",
      "从揭阳宾馆打车前往潮汕机场。",
      "国庆期间预留堵车和机场安检缓冲。"
    ));

    const routeLayer = L.featureGroup([
      arrivalRoad,
      shantouStationRoad,
      trainRoute,
      jieyangStationRoad,
      returnRoad
    ]).addTo(map);

    L.control.layers(
      { "本地潮汕底图": basemap },
      {
        "三市边界": boundaryLayer,
        "主行程动车站": primaryStations,
        "补充动车站": secondaryStations,
        "吃玩主点": foodLayer,
        "玩": playLayer,
        "已订住宿": hotelLayer,
        "机场": airportLayer,
        "当前路线示意": routeLayer
      },
      { position: "topright", collapsed: true }
    ).addTo(map);

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function() {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML =
        '<b>图例</b><br>' +
        '<i style="background:#e87824"></i>吃（主点及已核准附属点）<br>' +
        '<i style="background:#398761"></i>玩<br>' +
        '<i style="background:#2f6fbb"></i>已订住宿<br>' +
        '<i style="background:#263a65"></i>动车站／动车线<br>' +
        '<i style="background:#8f4d8c"></i>机场／打车接驳';
      return div;
    };
    legend.addTo(map);

    const cityBounds = {
      all: boundaryLayer.getBounds(),
      chaozhou: L.latLngBounds([[23.50, 116.53], [24.25, 117.20]]),
      shantou: L.latLngBounds([[23.00, 116.35], [23.62, 117.15]]),
      jieyang: L.latLngBounds([[22.85, 115.60], [23.78, 116.62]]),
      route: routeLayer.getBounds()
    };

    function renderList(city) {
      const list = document.getElementById("place-list");
      const allPlaces = [
        ...hotelMarkers.map(item => ({ ...item, kind: "hotel" })),
        ...foodMarkers.map(item => ({
          ...item,
          kind: item.place.city === "chaozhou" ? "play" : "food"
        })),
        ...playMarkers.map(item => ({ ...item, kind: "play" }))
      ];
      const visible = allPlaces.filter(item => city === "all" || city === "route" || item.place.city === city);
      const visiblePoints = visible.reduce((sum, item) => sum + (item.place.pointCount || 0), 0);
      document.getElementById("visible-count").textContent =
        visible.length + " 个地点 · " + visiblePoints + " 个美食编号点";
      list.innerHTML = "";
      visible.forEach(item => {
        const button = document.createElement("button");
        button.className = "place-button";
        button.innerHTML =
          '<b><span class="city-dot" style="background:' + (item.kind === "hotel" ? "#2f6fbb" : item.kind === "play" || item.place.city === "chaozhou" ? "#398761" : "#e87824") + '"></span>' + item.place.name + "</b>" +
          "<small>" + (item.kind === "hotel" ? "住 · " : item.kind === "play" ? "玩 · " : "") + item.place.short + (item.place.pointCount
            ? " · " + item.place.pointCount + " 个编号点"
            : item.kind === "food" ? " · 补充片区" : "") + "</small>";
        button.addEventListener("click", () => {
          map.panTo([item.place.lat, item.place.lng], { animate: true, duration: .5 });
          if (item.kind === "food") showChildPoints(item.place);
          else childFoodLayer.clearLayers();
          item.marker.openPopup();
        });
        list.appendChild(button);
      });
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        const city = button.dataset.city;
        childFoodLayer.clearLayers();
        map.fitBounds(cityBounds[city], {
          paddingTopLeft: window.innerWidth > 700 ? [360, 150] : [20, 150],
          paddingBottomRight: [30, window.innerWidth > 700 ? 30 : 180],
          maxZoom: city === "route" ? 10 : 11
        });
        renderList(city);
        if (city === "route") arrivalRoad.openPopup();
      });
    });

    const panelToggle = document.getElementById("panel-toggle");
    panelToggle.addEventListener("click", () => {
      const collapsed = document.body.classList.toggle("panel-collapsed");
      panelToggle.textContent = collapsed ? "展开" : "收起";
      panelToggle.setAttribute("aria-expanded", String(!collapsed));
      window.setTimeout(() => map.invalidateSize({ pan: false }), 220);
    });

    renderList("all");
    map.fitBounds(cityBounds.all, {
      paddingTopLeft: window.innerWidth > 700 ? [360, 150] : [20, 140],
      paddingBottomRight: window.innerWidth > 700 ? [40, 40] : [20, 170]
    });
  </script>
</body>
</html>
